plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'si.vzpenjaca.kontrola'
    compileSdk 36

    defaultConfig {
        applicationId "si.vzpenjaca.kontrola"
        minSdk 24
        targetSdk 36
        versionCode 10
        versionName "1.2.5"
    }

    signingConfigs {
        release {
            storeFile file('../vzpenjaca-release.jks')
            storePassword 'vzpenjacakontrola2026'
            keyAlias 'vzpenjaca'
            keyPassword 'vzpenjacakontrola2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Pure Android SDK implementation (zero external library bloat)
}
